name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is already installed on GitHub's runners; just accept its licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: |
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          set +e
          gradle assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Gradle errors::$(grep -nE '^e: |error:|What went wrong|Execution failed|Caused by|Could not|not found|Unresolved|FAILURE' build.log | head -50 | enc)"
            echo "::error title=Gradle log tail::$(tail -n 45 build.log | enc)"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: hub-apk
          path: app/build/outputs/apk/release/*.apk

      # Always-the-same download link for the Downloader app:
      # https://github.com/<you>/<repo>/releases/download/latest/app-release.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: app/build/outputs/apk/release/app-release.apk
