name: Keep Supabase awake

# Supabase's free plan pauses a project after 7 days without activity.
# This sends a small database query every 2 days so it never gets close.
on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the HUB database
        run: |
          # The publishable key is the same public one the app uses (it is already in the repo).
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
              -H "apikey: sb_publishable_jPgz8DY03Efnra8ShNlFtQ_KhS9l42L" \
              "https://hovbbyirispeqkpgrznv.supabase.co/rest/v1/playlists?select=id&limit=1")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Supabase did not answer with 200"; cat /tmp/out.json; exit 1
